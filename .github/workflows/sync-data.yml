name: Sync Data from Other Firebase

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run sync script
        env:
          SOURCE_FIREBASE_SA: ${{ secrets.SOURCE_FIREBASE_SA }}
        run: node scripts/sync-data.js
